name: collect day-ahead prices

on:
  # PAUSED on request. Uncomment the two cron lines to resume: 12:00 and 16:00 UTC
  # run after the ~12:45 CET SDAC publication in both CET and CEST, the second pass
  # catching late publication or corrections. The default source needs no secret.
  # schedule:
  #   - cron: "0 12 * * *"
  #   - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Which source to collect from"
        type: choice
        options: [energy-charts, entsoe]
        default: energy-charts
      start:
        description: "First delivery day (YYYY-MM-DD), for a manual backfill"
        required: false
      end:
        description: "Exclusive last delivery day (YYYY-MM-DD)"
        required: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        run: |
          SOURCE="${{ inputs.source || 'energy-charts' }}"
          if [ -n "${{ inputs.start }}" ]; then
            python -m energy_prices backfill --source "$SOURCE" \
              --start "${{ inputs.start }}" \
              ${{ inputs.end && format('--end {0}', inputs.end) || '' }}
          else
            python -m energy_prices daily --source "$SOURCE"
          fi

      - name: Commit new prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no new prices"
          else
            git commit -m "data: day-ahead prices as of $(date -u +%Y-%m-%dT%H:%MZ)"
            for attempt in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((2 ** attempt))
            done
          fi
